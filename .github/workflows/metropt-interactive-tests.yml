name: MetroPT Interactive Application Tests

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: metropt-industrial-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: metropt-industrial-ai/requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Verify dependencies
        run: |
          python -c "import numpy, pandas, scipy, sklearn, pytest; print('Dependencies imported successfully.')"

      - name: Compile application and tests
        run: |
          python -m py_compile src/interactive_pipeline.py dashboard/app.py tests/test_interactive_pipeline.py

      - name: Run interactive pipeline tests
        run: |
          python -m pytest tests/test_interactive_pipeline.py -v
